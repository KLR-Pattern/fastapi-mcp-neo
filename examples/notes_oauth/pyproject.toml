[project]
name = "fastapi-mcp-neo-example-notes-oauth"
version = "0.1.0"
description = "Consumer example: GitHub OAuth login + protected notes API + MCP OAuth (Claude Code)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "asgi-lifespan>=2.1",
    "python-multipart>=0.0.32",
    "fastapi-mcp-neo[mcp]>=0.3",
]

[dependency-groups]
# optional tracing: uv sync --group otel + OTEL_OTLP_ENDPOINT=http://localhost:4317
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

[tool.uv.sources]
# The example consumes the library from the repo root, exactly like an
# external consumer would from PyPI — tests/test_example_public_api.py
# guards that it never reaches into library internals.
fastapi-mcp-neo = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
