[project]
name = "fastapi-mcp-neo"
version = "0.14.0"
description = "The agent access layer for FastAPI: one graphql_query tool with composition and per-caller auth, derived from your existing app — zero decorators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "tangkikodo" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "graphql-core>=3.2,<4",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    # is_typeddict must recognize BOTH typing and typing_extensions TypedDicts
    "typing-extensions>=4.6",
    # tracer plumbing only — a no-op without an SDK installed (L3 context
    # propagation; see "Observability" in the README)
    "opentelemetry-api>=1.20",
]

[project.optional-dependencies]
# 4.0.10 verified end-to-end (tools, queries, mutations, streamable HTTP,
# header passthrough e2e); <5 until a 5.x lands and gets the same pass.
mcp = ["fastmcp>=4.0.10,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_mcp_neo"]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.20",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastmcp>=4.0.10,<5",
    "python-multipart>=0.0.32",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "asgi_lifespan.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
